[project]
name = "asio-deployment"
version = "0.1.0"
description = "ASIO V3.1 S3 — Deployment Controller, shared durable job runner and ServingPool readiness writer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asio_deployment"]

[tool.pytest.ini_options]
markers = [
    "gpu: needs a GPU host with Docker + NVIDIA Container Toolkit",
    "postgres: needs ASIO_TEST_PG_DSN pointing at a disposable PostgreSQL database",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
show_error_codes = true
plugins = ["pydantic.mypy"]
